name: Nuvemshop Tiendanube
description: >-
  Nuvemshop (Tiendanube in Spanish-speaking markets) is the leading e-commerce
  platform in Latin America, powering online stores for merchants across Brazil,
  Argentina, Mexico, Chile, Colombia and beyond. Its REST API lets partners and
  developers build public apps and integrations that manage products, variants,
  images, categories, orders, draft orders, abandoned checkouts, customers,
  coupons, discounts, transactions, payment providers, shipping carriers,
  locations, metafields, scripts and store data. Apps authenticate with a
  restricted OAuth 2 authorization-code flow (non-expiring bearer tokens),
  respect a leaky-bucket rate limit, and subscribe to a rich catalog of webhooks
  (order, product, customer, category, fulfillment, subscription and data-protection
  events) verified with HMAC-SHA256. The platform also ships an official CLI,
  the nube-sdk JavaScript packages, and the Nimbus design system.
